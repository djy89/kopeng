name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build (strict tsc — the only static gate)
        run: npm run build

      - name: Unit + integration tests (in-memory SQLite / in-process Fastify)
        run: npx vitest run tests/unit tests/integration

      - name: Dreaming replay harness (zero-LLM regression net)
        run: npm run dream:replay
