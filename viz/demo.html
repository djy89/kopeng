<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KOPENG · demo</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23FF6A00'/%3E%3C/svg%3E">
  <!-- Local-first: no external font egress (see styles.css monospace fallback). -->
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Demo-only chrome. 100% synthetic data — no API wiring, safe to record/share. */
    html, body { height: 100%; }
    body { overflow: hidden; }
    .demo-main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .demo-stage { position: relative; flex: 1; min-height: 0; background: hsl(var(--graph-bg)); overflow: hidden; }
    .demo-stage svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .demo-grid {
      pointer-events: none; position: absolute; inset: 0; opacity: .18;
      background-image:
        linear-gradient(hsl(var(--border-subtle)) 1px, transparent 1px),
        linear-gradient(90deg, hsl(var(--border-subtle)) 1px, transparent 1px);
      background-size: 80px 80px;
    }
    .demo-caption {
      position: absolute; left: 50%; bottom: 4.5rem; transform: translateX(-50%);
      font-size: .95rem; letter-spacing: .04em; color: hsl(var(--text-primary));
      background: hsl(var(--surface-01) / .85); border: 1px solid hsl(var(--border-subtle));
      padding: .45rem 1rem; opacity: 0; transition: opacity 400ms ease;
      white-space: nowrap; max-width: 90vw;
    }
    .demo-caption.on { opacity: 1; }
    .demo-caption .cap-beat { color: hsl(var(--accent)); margin-right: .6rem; }
    /* while playing, ALL app chrome leaves the frame — pure canvas + captions.
       Move the mouse or pause to bring the controls back. */
    body.playing header, body.playing .demo-bar { opacity: 0; pointer-events: none; }
    header, .demo-bar { transition: opacity 350ms ease; }
    body.playing.peek header, body.playing.peek .demo-bar { opacity: 1; pointer-events: auto; }
    /* memory detail card (inspect beat) — same fields as the real memory schema */
    .demo-detail {
      position: absolute; top: 3rem; right: 2.2rem; width: 320px; max-width: 84vw;
      background: hsl(var(--surface-01) / .96); border: 1px solid hsl(var(--border-strong));
      padding: .9rem 1rem; font-size: .78rem; line-height: 1.5;
      opacity: 0; transform: translateX(14px); transition: opacity 450ms ease, transform 450ms ease;
      pointer-events: none;
    }
    .demo-detail.on { opacity: 1; transform: translateX(0); }
    .demo-detail h4 { font-size: .72rem; letter-spacing: .16em; text-transform: uppercase; color: hsl(var(--accent)); margin-bottom: .55rem; }
    .demo-detail dl { display: grid; grid-template-columns: auto 1fr; gap: .15rem .8rem; }
    .demo-detail dt { color: hsl(var(--text-tertiary)); }
    .demo-detail dd { color: hsl(var(--text-primary)); overflow-wrap: anywhere; }
    .demo-detail .dd-content { grid-column: 1 / -1; margin-top: .45rem; padding: .45rem .55rem; border-left: 2px solid hsl(var(--accent)); color: hsl(var(--text-secondary)); }
    .demo-conf-bar { height: 4px; background: hsl(var(--border-subtle)); margin-top: .4rem; grid-column: 1 / -1; }
    .demo-conf-bar span { display: block; height: 100%; width: 0; background: hsl(var(--accent)); transition: width 900ms ease; }
    .demo-tagchip { display: inline-block; border: 1px solid hsl(var(--border-subtle)); padding: 0 .35rem; margin: 0 .25rem .2rem 0; color: hsl(var(--text-secondary)); }
    .demo-bar {
      display: flex; align-items: center; gap: .6rem; padding: .5rem .9rem;
      border-top: 1px solid hsl(var(--border-subtle)); background: hsl(var(--surface-01));
      font-size: .8rem; flex-wrap: wrap;
    }
    .demo-btn {
      font: inherit; color: hsl(var(--text-primary)); background: transparent;
      border: 1px solid hsl(var(--border-strong));
      padding: .25rem .8rem; cursor: pointer;
    }
    .demo-btn:hover { border-color: hsl(var(--accent)); color: hsl(var(--accent)); }
    .demo-btn.primary { border-color: hsl(var(--accent)); color: hsl(var(--accent)); }
    .demo-sep { opacity: .35; }
    .demo-beats { display: flex; gap: .35rem; }
    .demo-beat-dot {
      width: 22px; height: 4px; background: hsl(var(--border-subtle));
      cursor: pointer; border: 0; padding: 0;
    }
    .demo-beat-dot.done { background: hsl(var(--accent) / .45); }
    .demo-beat-dot.now { background: hsl(var(--accent)); }
    .demo-speed { display: flex; align-items: center; gap: .35rem; }
    .demo-speed input { accent-color: hsl(var(--accent)); width: 90px; }
    .demo-clock { opacity: .7; min-width: 5.5ch; text-align: right; font-variant-numeric: tabular-nums; }
    .demo-tag { opacity: .55; margin-left: auto; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span class="brand-prompt">&gt;</span>
      <span class="brand-name">KOPENG</span>
      <span class="brand-sub">memory.system — demo</span>
      <span class="brand-status-dot" title="synthetic"></span>
    </div>
    <div class="health">synthetic dataset · no live data</div>
    <button id="theme-toggle" title="Toggle light/dark theme" aria-label="Toggle theme">
      <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
      <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
    </button>
  </header>

  <div class="demo-main">
    <div class="demo-stage" id="stage">
      <div class="demo-grid"></div>
      <svg id="demo-canvas" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="demo-caption" id="caption"><span class="cap-beat" id="cap-beat"></span><span id="cap-text"></span></div>
      <aside class="demo-detail" id="detail-card" aria-hidden="true">
        <h4>memory · selected</h4>
        <dl>
          <dt>id</dt><dd id="dc-id">—</dd>
          <dt>type</dt><dd id="dc-type">—</dd>
          <dt>scope</dt><dd id="dc-scope">—</dd>
          <dt>source</dt><dd id="dc-source">—</dd>
          <dt>confidence</dt><dd id="dc-conf">—</dd>
          <div class="demo-conf-bar"><span id="dc-conf-bar"></span></div>
          <dt>observations</dt><dd id="dc-obs">—</dd>
          <dt>last seen</dt><dd id="dc-seen">—</dd>
          <dt>tags</dt><dd id="dc-tags">—</dd>
          <dd class="dd-content" id="dc-content">—</dd>
        </dl>
      </aside>
    </div>
    <div class="demo-bar">
      <button class="demo-btn primary" id="btn-play">play</button>
      <button class="demo-btn" id="btn-restart">restart</button>
      <span class="demo-sep">·</span>
      <div class="demo-beats" id="beat-dots"></div>
      <span class="demo-sep">·</span>
      <div class="demo-speed">
        <label for="speed">speed</label>
        <input type="range" id="speed" min="0.25" max="2" step="0.25" value="1">
        <span id="speed-val">1.0×</span>
      </div>
      <span class="demo-clock" id="clock">0.0s</span>
      <span class="demo-tag">synthetic · safe to record</span>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"
          integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i"
          crossorigin="anonymous"></script>
  <script src="demo.js"></script>
</body>
</html>
